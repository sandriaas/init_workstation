worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /data/logs/nginx-access.log main;
    error_log /data/logs/nginx-error.log warn;

    # Upstream definitions
    upstream multica_backend {
        server multica-backend:8080;
    }

    upstream hermes_api {
        server hermes:8642;
    }

    upstream hermes_dashboard {
        server hermes:9119;
    }

    upstream paperclip {
        server code_paperclip:3100;
    }

    # Health check endpoint
    server {
        listen 80;
        server_name _;

        # Aggregated health check
        location /health {
            content_type application/json;
            return 200 '{"status":"ok","services":{"multica":"http://multica-backend:8080/healthz","hermes":"http://hermes:8642/health","paperclip":"http://code_paperclip:3100/api/health"}}';
        }

        # Runner health
        location /runner/health {
            content_type application/json;
            return 200 '{"status":"ok","service":"ubuntu-runner"}';
        }

        # Multica API
        location /multica/ {
            proxy_pass http://multica_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Hermes Dashboard
        location /hermes/ {
            proxy_pass http://hermes_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Hermes API (OpenAI-compatible)
        location /hermes-api/ {
            proxy_pass http://hermes_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Paperclip
        location /paperclip/ {
            proxy_pass http://paperclip/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Default - serve static files from /data/www
        location / {
            root /data/www;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
