# Generated by manual recreation — mirrors vm_1.conf for vm_2

# ── Identity ──────────────────────────────────────────────────────────────────
VM_NAME="vm_2"
VM_HOSTNAME="vm-2"
VM_USER="sandriaas"
# SHA-512 hash of VM password (generate via: mkpasswd --method=SHA-512 --rounds=4096 'YOUR_PASSWORD')
VM_PASSWORD_HASH="$6$rounds=4096$GFODZWH6pRbsllKo$R.xWj.X94Pv/zV/Bs3cy3WDxXvQ1z25slwrKVbbi41WwsErzbz56rYwb7.arGnKE4vGjGpCEdY4QtC0wF/319/"

# ── Machine / Firmware ────────────────────────────────────────────────────────
VM_MACHINE_TYPE="q35"
VM_FIRMWARE="uefi"
VM_CPU_MODEL="host-passthrough"

# ── Resources ─────────────────────────────────────────────────────────────────
VM_RAM_MB="6144"
VM_VCPUS="4"

# ── Disk ──────────────────────────────────────────────────────────────────────
VM_DISK_GB="32"
VM_DISK_PATH="/var/lib/libvirt/images/vm_2.qcow2"
VM_DISK_FORMAT="qcow2"
VM_DISK_BUS="virtio"

# ── OS ────────────────────────────────────────────────────────────────────────
VM_OS_VARIANT="ubuntu24.04"
VM_ISO_PATH="/home/sandriaas/iso/ubuntu-24.04.3-live-server-amd64.iso"
VM_CLOUD_IMG_URL="https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
VM_CLOUD_IMG_PATH="/home/sandriaas/iso/noble-server-cloudimg-amd64.img"
VM_BOOT_ORDER="hd,cdrom"
VM_AUTOINSTALL="no"   # uses cloud image, NOT autoinstall ISO
VM_SEED_ISO="/var/lib/libvirt/images/vm_2-seed.iso"

# ── Network ───────────────────────────────────────────────────────────────────
VM_NET_TYPE="network"
VM_NET_SOURCE="default"
VM_NET_MODEL="virtio"
VM_NET_IFACE="enp1s0"
VM_STATIC_IP=""             # using DHCP (DHCP reservation 192.168.122.51)
VM_DHCP_RESERVATION="192.168.122.51"
VM_GATEWAY="192.168.122.1"
VM_DNS="1.1.1.1,8.8.8.8"
VM_SSH_PORT="22"
VM_MAC="52:54:00:c8:2e:a7"

# ── Display / Console ─────────────────────────────────────────────────────────
# vm_2 uses VNC on 127.0.0.1 (Cockpit-accessible) — different from vm_1 (headless)
VM_GRAPHICS="vnc,listen=127.0.0.1"
VM_VIDEO="virtio"
VM_CONSOLE="pty"

# ── Features ──────────────────────────────────────────────────────────────────
VM_FEATURES="acpi,apic"
VM_CLOCK="utc"
VM_AUTOSTART="no"

# ── Notes ─────────────────────────────────────────────────────────────────────
# Created from cloud image (noble-server-cloudimg-amd64.img), ~30s boot.
# Cloud-init reads vm_2-seed.iso on first boot to set hostname, user, SSH.
# Differs from vm_1: 6GB RAM (vs 4GB), DHCP (vs static), VNC graphics (vs none).
