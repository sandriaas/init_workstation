[Service]
# Disable systemd's auto-restart behavior that causes a tight loop
# in WSL2 (where the launcher init process sends SIGTERM on network reset)
Restart=no

# If we do restart, wait at least 60s to avoid tight loop
RestartSec=60s

# Only kill the main process, not children
KillMode=process

# Give the daemon 2 minutes to shut down gracefully before SIGKILL
TimeoutStopSec=120s
