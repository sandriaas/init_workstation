[boot]
# Enable systemd in WSL2 (required for k3s, tailscaled service, etc.)
systemd=true

[user]
# Default user (the Zeabur install script creates this user)
default=zeabur

[network]
# CRITICAL: Disable WSL2's auto-generation of /etc/resolv.conf
# Without this, WSL overwrites our custom DNS on every boot
generateResolvConf=false
