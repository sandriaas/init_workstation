# Public exposure for stalwart.cfworkers.dpdns.org
#
# This file is DATA read by apply-fixes.sh on every k3s restart to re-create
# the public Ingress. To add a new public domain, do NOT edit any script -
# run expose-service.sh which drops a new .conf file here automatically:
#
#   sudo /opt/zeabur-fixes/expose-service.sh <subdomain> <namespace> <service> <port>
#
# Format: simple key=value lines.
#   sub  = subdomain (host becomes <sub>.cfworkers.dpdns.org)
#   ns   = kubernetes namespace of the service
#   svc  = kubernetes service name
#   port = service port
sub=stalwart
ns=environment-6a242c9f95b39806d284aaa7
svc=service-6a242f96f1be9943f1f972a7
port=8080
