# /etc/systemd/system/k3s.service.d/override.conf
#
# Drop-in for k3s.service. Overrides the default ExecStart to add the
# --resolv-conf flag (so pods use /etc/k3s-pod-resolv.conf with cluster
# DNS first), and runs /opt/zeabur-fixes/apply-fixes.sh after k3s starts
# to re-apply Zeabur cluster fixes.
#
# To install:
#   sudo mkdir -p /etc/systemd/system/k3s.service.d
#   sudo cp override.conf /etc/systemd/system/k3s.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart k3s
#
# This file is independent of the main k3s.service unit, so a `k3s` package
# upgrade that rewrites k3s.service will not affect this drop-in.

[Service]
ExecStart=
ExecStart=/usr/local/bin/k3s server --resolv-conf /etc/k3s-pod-resolv.conf
ExecStartPost=/opt/zeabur-fixes/apply-fixes.sh
